<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#1A1A2E"/>
  <!-- Two vertical bars representing Source A and Source B -->
  <rect x="4" y="8" width="10" height="16" rx="2" fill="#7C3AED" opacity="0.9"/>
  <rect x="18" y="8" width="10" height="16" rx="2" fill="#374151" opacity="0.9"/>
  <!-- Matched connector line (green) -->
  <line x1="14" y1="13" x2="18" y2="13" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="16" x2="18" y2="16" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="19" x2="18" y2="19" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Check mark on green (matched) indicator -->
  <circle cx="16" cy="13" r="1" fill="#059669"/>
  <circle cx="16" cy="16" r="1" fill="#059669"/>
  <!-- Exception dot (red) -->
  <circle cx="16" cy="19" r="1" fill="#DC2626"/>
</svg>
